<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>QLCV Y Khoa</title>
    <script>
      // SPA fallback for GitHub Pages
      // Khi GitHub Pages trả về 404 cho các route của React Router,
      // script này encode path vào query string rồi redirect về index.html.
      // pathSegmentsToKeep = 1 → giữ lại segment tên repo (/Demo.App.QLBV)
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.host +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?p=/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search
              ? '&q=' + l.search.slice(1).replace(/&/g, '~and~')
              : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
