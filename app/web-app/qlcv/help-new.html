<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ giúp - QLCV Y Khoa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-hospital-user"></i>
                    <span>QLCV Y Khoa</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Menu chính</div>
                    <a href="dashboard-staff.html" class="nav-item">
                        <i class="fas fa-chart-pie"></i>
                        <span>Bảng điều khiển</span>
                    </a>
                    <a href="tickets-list.html" class="nav-item">
                        <i class="fas fa-ticket-alt"></i>
                        <span>Phiếu yêu cầu</span>
                    </a>
                    <a href="tasks-list.html" class="nav-item">
                        <i class="fas fa-tasks"></i>
                        <span>Công việc của tôi</span>
                    </a>
                    <a href="task-pool.html" class="nav-item">
                        <i class="fas fa-swimming-pool"></i>
                        <span>Công việc chờ nhận</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Khác</div>
                    <a href="settings.html" class="nav-item">
                        <i class="fas fa-cog"></i>
                        <span>Cài đặt</span>
                    </a>
                    <a href="help.html" class="nav-item active">
                        <i class="fas fa-question-circle"></i>
                        <span>Trợ giúp</span>
                    </a>
                    <a href="help-workflows.html" class="nav-item">
                        <i class="fas fa-project-diagram"></i>
                        <span>Quy trình làm việc</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">NVA</div>
                    <div class="user-info">
                        <div class="user-name">Nguyễn Văn A</div>
                        <div class="user-role">Nhân viên</div>
                    </div>
                </div>
                <div class="logout-btn">
                    <a href="login.html" style="color: var(--gray-500); margin-left: auto;">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="page-title">
                    <h1>
                        <i class="fas fa-life-ring"></i>
                        Trung tâm Trợ giúp
                    </h1>
                    <p style="color: var(--gray-500); font-size: 0.875rem; margin-top: 0.25rem;">Hướng dẫn sử dụng và giải đáp thắc mắc</p>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area" id="mainView">
                <!-- This will be populated dynamically by JavaScript -->
            </div>
        </main>
    </div>

    <style>
        /* Help Center Additional Styles */
        .search-box-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            margin-top: 4px;
            box-shadow: var(--shadow-lg);
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .search-suggestions.active {
            display: block;
        }

        .search-suggestion-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--gray-100);
            transition: background 0.2s;
        }

        .search-suggestion-item:hover {
            background: var(--gray-50);
        }

        .search-suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-title {
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 0.25rem;
        }

        .suggestion-category {
            font-size: 0.75rem;
            color: var(--gray-500);
        }

        .category-card {
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .category-icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-card {
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: var(--gray-200);
            overflow: hidden;
        }

        .video-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .video-info {
            padding: 1rem;
        }

        .video-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--gray-900);
        }

        .video-views {
            font-size: 0.875rem;
            color: var(--gray-500);
        }

        .article-card {
            padding: 1rem;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .article-card:hover {
            background: var(--gray-50);
            border-color: var(--primary-color);
        }

        .article-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--gray-500);
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .breadcrumb {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--gray-600);
            flex-wrap: wrap;
        }

        .breadcrumb a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .article-content {
            line-height: 1.8;
        }

        .article-content h2 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--gray-900);
        }

        .article-content h3 {
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--gray-800);
        }

        .article-content p {
            margin-bottom: 1rem;
        }

        .article-content ul, .article-content ol {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }

        .article-content li {
            margin-bottom: 0.5rem;
        }

        .article-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--gray-200);
        }

        .feedback-section {
            background: var(--gray-50);
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 2rem;
            text-align: center;
        }

        .feedback-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .feedback-btn {
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--gray-300);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .feedback-btn:hover {
            background: var(--gray-100);
        }

        .feedback-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .feedback-form {
            margin-top: 1rem;
            text-align: left;
        }

        .related-articles {
            margin-top: 2rem;
        }

        .related-article-item {
            padding: 0.75rem;
            border-left: 3px solid var(--primary-color);
            background: var(--gray-50);
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .related-article-item:hover {
            background: var(--gray-100);
        }

        .accordion-item {
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }

        .accordion-header {
            padding: 1rem 1.5rem;
            background: var(--gray-50);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: background 0.2s;
        }

        .accordion-header:hover {
            background: var(--gray-100);
        }

        .accordion-header span {
            flex: 1;
            font-weight: 600;
        }

        .accordion-icon {
            transition: transform 0.3s;
        }

        .accordion-item.active .accordion-icon {
            transform: rotate(180deg);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 1.5rem;
        }

        .accordion-item.active .accordion-content {
            max-height: 1000px;
            padding: 1rem 1.5rem;
            transition: max-height 0.5s ease-in;
        }

        .contact-form {
            display: grid;
            gap: 1rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--gray-700);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-group .error {
            color: var(--danger);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background: var(--success-light);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .filter-chips {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .chip {
            padding: 0.5rem 1rem;
            background: var(--gray-100);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .chip:hover {
            background: var(--gray-200);
        }

        .chip.active {
            background: var(--primary-color);
            color: white;
        }

        .video-player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            padding: 2rem;
            align-items: center;
            justify-content: center;
        }

        .video-player-modal.active {
            display: flex;
        }

        .video-player-content {
            position: relative;
            width: 100%;
            max-width: 1200px;
            background: black;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-player-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: 0.5rem;
        }

        .video-embed {
            width: 100%;
            aspect-ratio: 16/9;
        }

        @media print {
            .sidebar, .topbar, .article-actions, .feedback-section, .related-articles {
                display: none;
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>

    <script src="help-data.js"></script>
    <script src="help-app.js"></script>
</body>
</html>
